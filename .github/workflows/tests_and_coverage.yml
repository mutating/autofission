name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install dependencies and package
        shell: bash
        run: |
          python -m pip install -r requirements_dev.txt
          python -m pip install -e .

      - name: Run tests with 100% line and branch coverage
        run: |
          coverage run --branch -m pytest --cache-clear --assert=plain
          coverage report --fail-under=100
          coverage xml

      - name: Upload Linux coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          format: cobertura
        continue-on-error: true

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_dev.txt
      - run: python -m pip install -r requirements_dev.txt
      - name: Build and validate distributions
        run: |
          python -m build
          twine check --strict dist/*
      - name: Install wheel outside the checkout
        shell: bash
        run: |
          test_dir="$(mktemp -d)"
          python -m venv "$test_dir/venv"
          "$test_dir/venv/bin/python" -m pip install dist/*.whl
          cd "$test_dir"
          "$test_dir/venv/bin/autofission" --version
          "$test_dir/venv/bin/python" -m autofission --version
          "$test_dir/venv/bin/python" -m pip check

  dependency-range:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: minimum
            spec: kubernetes==36.0.3
          - name: latest-compatible
            spec: kubernetes>=36.0.3,<37.0.0
    name: Kubernetes dependency (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install -r requirements_dev.txt
          python -m pip install -e . "${{ matrix.spec }}"
          pytest

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: |
          helm lint deploy/helm/autofission --strict
          helm template autofission deploy/helm/autofission --namespace fission > rendered.yaml
          test "$(grep -c '^kind: Deployment$' rendered.yaml)" -eq 1
          test "$(grep -c '^kind: ClusterRole$' rendered.yaml)" -eq 1
          ! helm lint deploy/helm/autofission --set replicaCount=2
