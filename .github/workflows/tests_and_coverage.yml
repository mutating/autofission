name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15.0-rc.1"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install dependencies and package
        shell: bash
        run: |
          python -m pip install -r requirements_dev.txt
          python -m pip install -e .

      - name: Run tests with 100% line and branch coverage
        run: |
          coverage run --branch -m pytest -m "not e2e" --cache-clear --assert=plain
          coverage report --fail-under=100
          coverage xml

      - name: Upload Linux coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          format: cobertura

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_dev.txt
      - run: python -m pip install -r requirements_dev.txt
      - name: Build and validate distributions
        run: |
          python -m build
          twine check --strict dist/*
      - name: Install wheel outside the checkout
        shell: bash
        run: |
          test_dir="$(mktemp -d)"
          python -m venv "$test_dir/venv"
          "$test_dir/venv/bin/python" -m pip install dist/*.whl
          cd "$test_dir"
          "$test_dir/venv/bin/autofission" --version
          "$test_dir/venv/bin/python" -m autofission --version
          "$test_dir/venv/bin/python" -m pip check

  dependency-range:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: legacy-minimum
            python: "3.8"
            spec: kubernetes==27.2.0
          - name: legacy-latest
            python: "3.9"
            spec: kubernetes>=27.2.0,<36.0.0
          - name: current-minimum
            python: "3.10"
            spec: kubernetes==36.0.3
          - name: current-latest
            python: "3.15.0-rc.1"
            spec: kubernetes>=36.0.3,<37.0.0
    name: Kubernetes dependency (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install -r requirements_dev.txt
          python -m pip install -e . "${{ matrix.spec }}"
          pytest -m "not e2e"

  e2e:
    name: End-to-end (Kind, 3 workers)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install Python dependencies and package
        run: |
          python -m pip install -r requirements_dev.txt
          python -m pip install -e .

      - name: Install Kind and kubectl
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true
          version: v0.31.0
          kubectl_version: v1.34.0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install Fission CLI
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output fission \
            https://github.com/fission/fission/releases/download/v1.27.0/fission-v1.27.0-linux-amd64
          echo "69eb82c53945ae8bdd5842933a88459b7004fe8eb2f0ab1c3de0a814e04ca9e9  fission" \
            | sha256sum --check
          chmod +x fission
          sudo install fission /usr/local/bin/fission

      - name: Run real-cluster tests
        env:
          AUTOFISSION_E2E: "1"
          AUTOFISSION_E2E_ARTIFACTS: ${{ runner.temp }}/autofission-e2e-artifacts
        run: pytest -m e2e -vv --showlocals

      - name: Upload cluster diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cluster-diagnostics
          path: ${{ runner.temp }}/autofission-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: |
          helm lint deploy/helm/autofission --strict
          helm template autofission deploy/helm/autofission --namespace fission > rendered.yaml
          test "$(grep -c '^kind: Deployment$' rendered.yaml)" -eq 1
          test "$(grep -c '^kind: ClusterRole$' rendered.yaml)" -eq 1
          if helm lint deploy/helm/autofission --set replicaCount=2 2>&1 \
            | tee invalid-replica-count.log; then
            echo 'helm lint unexpectedly accepted replicaCount=2' >&2
            exit 1
          fi
          grep --fixed-strings 'replicaCount' invalid-replica-count.log
