{{- if .Values.priorityClasses.create }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "autofission.controllerPriorityClassName" . }}
  labels:
    {{- include "autofission.labels" . | nindent 4 }}
value: {{ .Values.priorityClasses.controller.value | int }}
globalDefault: false
preemptionPolicy: {{ .Values.priorityClasses.controller.preemptionPolicy }}
description: Keep the Autofission controller available while runtime Pods consume spare capacity.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "autofission.runtimePriorityClassName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "autofission.labels" . | nindent 4 }}
value: {{ .Values.priorityClasses.runtime.value | int }}
globalDefault: false
preemptionPolicy: {{ .Values.priorityClasses.runtime.preemptionPolicy }}
description: Low-priority, non-preempting class for elastic Fission function Pods.
{{- end }}
