{{- if .Values.networkPolicy.create }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "autofission.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autofission.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "autofission.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- end }}

