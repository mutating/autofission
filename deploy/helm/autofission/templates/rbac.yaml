{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "autofission.fullname" . }}
  labels:
    {{- include "autofission.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list"]
  - apiGroups: ["fission.io"]
    resources: ["functions"]
    verbs: ["list", "patch"]
  - apiGroups: ["fission.io"]
    resources: ["environments"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "autofission.fullname" . }}
  labels:
    {{- include "autofission.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "autofission.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "autofission.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

